<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INIRAH — Sign in</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f0f5fa 0%, #e9eef3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      max-width: 460px;
      width: 100%;
      background: white;
      border-radius: 48px;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .brand-header {
      background: #0f2c3d;
      padding: 32px 32px 24px;
      text-align: center;
    }

    .brand-header .logo {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #e9b35f 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .brand-header p {
      color: rgba(255,255,255,0.7);
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .form-container {
      padding: 40px 36px 44px;
    }

    .form-container h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b1c26;
      margin-bottom: 8px;
    }

    .greeting {
      color: #5b7c8c;
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #1e3a4a;
    }

    .input-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon i {
      position: absolute;
      left: 16px;
      color: #9bb7c4;
      font-size: 1rem;
      font-style: normal;
      font-weight: normal;
    }

    .input-icon input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border: 1.5px solid #e2edf2;
      border-radius: 60px;
      font-size: 1rem;
      font-family: inherit;
      background: white;
      transition: all 0.2s;
      outline: none;
    }

    .input-icon input:focus {
      border-color: #e9b35f;
      box-shadow: 0 0 0 3px rgba(233, 179, 95, 0.2);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 0.85rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #2c4a5a;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #e9b35f;
    }

    .forgot-link {
      color: #e9b35f;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      color: #c17b2e;
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      background: #0f2c3d;
      color: white;
      border: none;
      padding: 14px 0;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #1e4a6e;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b9cfda;
      font-size: 0.75rem;
      margin-bottom: 24px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #e2edf2;
    }

    .social-login {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .social-btn {
      background: white;
      border: 1.5px solid #e2edf2;
      border-radius: 60px;
      padding: 10px 20px;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: #1e3a4a;
    }

    .social-btn:hover {
      background: #f8fbfd;
      border-color: #e9b35f;
    }

    .signup-prompt {
      text-align: center;
      font-size: 0.85rem;
      color: #5b7c8c;
    }

    .signup-prompt a {
      color: #e9b35f;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #6f8f9c;
      text-decoration: none;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-home a:hover {
      color: #e9b35f;
    }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f2c3d;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1000;
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
      animation: fadeInUp 0.2s ease;
    }

    .toast-msg.error {
      background: #d9534f;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @media (max-width: 500px) {
      .form-container {
        padding: 32px 24px;
      }
      .social-btn {
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand-header">
    <div class="logo">INIRAH<span style="color:#e9b35f;">.</span></div>
    <p>your launchpad to the future</p>
  </div>
  <div class="form-container">
    <h2>Welcome back</h2>
    <div class="greeting">Sign in to continue your journey with INIRAH</div>

    <form id="loginForm">
      <div class="input-group">
        <label>Email address</label>
        <div class="input-icon">
          <i>📧</i>
          <input type="email" id="loginEmail" placeholder="hello@inirah.com" autocomplete="email" required>
        </div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="input-icon">
          <i>🔒</i>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberCheckbox"> <span>Remember me</span>
        </label>
        <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        ➡️ Sign in
      </button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span>or continue with</span>
      <div class="divider-line"></div>
    </div>

    <div class="social-login">
      <button class="social-btn" id="googleLoginBtn">🔵 Google</button>
      <button class="social-btn" id="linkedinLoginBtn">🔗 LinkedIn</button>
    </div>

    <div class="signup-prompt">
      Don't have an account? <a href="#" id="signupRedirect">Join INIRAH</a>
    </div>
    <div class="back-home">
      <a href="#" id="backHomeLink">← Back to home</a>
    </div>
  </div>
</div>

<script>
  (function() {
    // Safe toast notification (no external dependencies)
    function showMessage(msg, isError = false) {
      const existingToast = document.querySelector('.toast-msg');
      if(existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-msg' + (isError ? ' error' : '');
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    // Safe localStorage wrapper (prevents security errors)
    function setLocalStorage(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch(e) {
        console.warn("localStorage not available:", e);
        return false;
      }
    }

    function getLocalStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch(e) {
        console.warn("localStorage not available:", e);
        return null;
      }
    }

    function removeLocalStorage(key) {
      try {
        localStorage.removeItem(key);
        return true;
      } catch(e) {
        return false;
      }
    }

    // Demo credentials
    const validDemoCredentials = {
      email: "demo@inirah.com",
      password: "password123"
    };

    // DOM elements
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const rememberCheck = document.getElementById('rememberCheckbox');
    const forgotLink = document.getElementById('forgotPasswordLink');
    const googleBtn = document.getElementById('googleLoginBtn');
    const linkedinBtn = document.getElementById('linkedinLoginBtn');
    const signupRedirect = document.getElementById('signupRedirect');
    const backHomeLink = document.getElementById('backHomeLink');

    // Load saved email if any
    const savedEmail = getLocalStorage('inirah_remembered_email');
    if(savedEmail && emailInput) {
      emailInput.value = savedEmail;
      if(rememberCheck) rememberCheck.checked = true;
    }

    // Login handler
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if(!email || !password) {
        showMessage('Please fill in both email and password.', true);
        return;
      }

      if(!email.includes('@') || !email.includes('.')) {
        showMessage('Enter a valid email address.', true);
        return;
      }

      if(password.length < 4) {
        showMessage('Password must be at least 4 characters.', true);
        return;
      }

      // Demo authentication
      if(email === validDemoCredentials.email && password === validDemoCredentials.password) {
        if(rememberCheck.checked) {
          setLocalStorage('inirah_remembered_email', email);
        } else {
          removeLocalStorage('inirah_remembered_email');
        }
        showMessage(`✨ Welcome back, ${email.split('@')[0]}! Redirecting to dashboard...`);
        // Simulate redirect (replace with actual dashboard URL)
        setTimeout(() => {
          // In a real app: window.location.href = "/dashboard.html";
          showMessage("Demo: Dashboard would open here. Great to have you!");
          console.log("Login successful for", email);
        }, 1200);
      } 
      else {
        if(email !== validDemoCredentials.email && password === validDemoCredentials.password) {
          showMessage(`Unknown email. Try demo@inirah.com or sign up.`, true);
        } 
        else if(email === validDemoCredentials.email && password !== validDemoCredentials.password) {
          showMessage(`Incorrect password for ${email}. Hint: "password123"`, true);
        }
        else {
          showMessage('Invalid email or password. For demo use: demo@inirah.com / password123', true);
        }
      }
    });

    // Forgot password
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      showMessage('📧 Reset link sent (demo). Contact inirah.hrteam@gmail.com for support.');
    });

    // Social buttons
    googleBtn.addEventListener('click', () => {
      showMessage('🔐 Google authentication — coming soon.');
    });
    linkedinBtn.addEventListener('click', () => {
      showMessage('🔐 LinkedIn authentication — coming soon.');
    });

    // Sign-up
    signupRedirect.addEventListener('click', (e) => {
      e.preventDefault();
      showMessage('📝 Join INIRAH early access! Email inirah.hrteam@gmail.com');
      // Optionally open mail client
      window.location.href = "mailto:inirah.hrteam@gmail.com?subject=Join%20INIRAH%20early%20access";
    });

    // Back to home (just a demo action)
    backHomeLink.addEventListener('click', (e) => {
      e.preventDefault();
      showMessage('🏠 Returning to INIRAH homepage...');
      // If you have a welcome page, redirect: window.location.href = "welcome.html";
    });
  })();
</script>
</body>
</html>
